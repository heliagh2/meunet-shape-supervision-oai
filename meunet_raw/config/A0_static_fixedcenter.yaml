# === A0 (static t, fixed centre): full-data headroom reference ===
# All 356 train cases, i.e. annotated_fraction defaults to 1.0 and no case is
# withheld. Two deliberate differences from baseline_descriptors.yaml:
#   1. barrier_t_mu: 1.0  -- schedule off, matching A1.1-static and everything
#      downstream, so t is identical across arms that differ in dataset size.
#   2. fixed_center: auto -- the A1 family showed fixed centring beats GT
#      centring (0.636 vs 0.586 at 30%), and the headroom reference has to use
#      the same framing as the arms it bounds, or the gap mixes two effects.
# The scheduled-t / GT-centred A0 already run stays valid on its own terms; this
# is its counterpart in the regime the rest of the ladder now uses.

# dataset: fixed per-case sampling (1 STD + 1 EXP patch reused for entire training)

# data
images_dir: /ivi/zfs/s0/original_homes/isimion/knee_dataset/OAI_ZIB_DESS
labels_dir: /ivi/zfs/s0/original_homes/isimion/knee_dataset/OAI_ZIB_segmentations
splits_file: /home/isimion/meunet-shape-supervision-oai/nnunet/nnUNet_preprocessed/Dataset701_OAIKnee/splits_final.json
dataset_name: Dataset701_OAIKnee

# resolved from all 356 train stems (no cases are withheld in A0)
fixed_center: auto

classes: [0, 1, 2, 3, 4]

# model
in_channels: 1
n_classes: 5
#EXP will become [400,400,400]
patch_size: [200, 200, 200]
expand_factor: 2.0
enc_channels: [16, 32, 64, 128]
dec_channels: [16, 32, 64]
norm: batch

# training / loader
batch_size: 2
num_workers: 6
fg_sampling_prob: 0.5


loss: dice_ce_weighted
smooth_dice_eps: 1.0e-6

optimizer: adam
lr: 0.0009
weight_decay: 1.0e-05
amp: true

# Matched-compute checkpoint. A1.x takes 106 steps/epoch (107 cases) x 250 =
# 26,500 steps; A0 takes 356/epoch and reaches the same total at epoch ~74.
# This saves ONE extra file, checkpoint_budget_best.pt: the best-val model among
# epochs <= 75, frozen there. Normal checkpoint_best/final are unaffected, and
# so is early stopping. At that point both arms have taken the same number of
# updates and seen the same number of patch presentations -- and since each case
# contributes one FIXED patch reused every epoch, the only remaining difference
# is 356 distinct patches x 75 repeats vs 107 distinct x 250.
budget_epoch: 75

epochs: 250
early_stop_patience: 100
min_lr: 1.0e-06
deep_supervision_weight: 0.5

seed: 777
log_every: 25
val_every: 1

#visualizations
viz_enable: true
viz_every_n_epochs: 5

#Exp toggles 
use_seg_loss: false         # <— this makes it truly descriptor-only
monitor_seg_loss: true      # <— keeps loss_va_seg + seg(log) comparable
detach_desc_channels_for_seg: true  # irrelevant if use_seg_loss=false, but safe
# all classes
desc_only_classes: [1, 2, 3, 4]
centroid_classes: [1, 2, 3, 4]
volume_classes: [1, 2, 3, 4]
avgdist_classes: [1, 2, 3, 4]
avgdist_axis_classes: [1, 2, 3, 4]
shape_on: both                  # apply shape losses on EXP and STD patches

lambda_volume: 1.0              # small now for first experiment logbarrier
lambda_centroid: 5.0            # small now for first experiment logbarrier
lambda_avgdist: 0.0             # radial mean distance to centroid barrier
lambda_avgdist_axis: 1.0        # per-axis spread-to-centroid barrier
centroid_norm: true             # normalize coords to [0,1]

##logbarrier toggles
barrier_t: 5.0
# per-epoch tightening of the shape barrier (volume/centroid/avgdist/avgdist_axis
# only — moment2/3/inv stay at fixed barrier_t, see train script comment).
# Kervadec et al. (1904.04205) style: t <- min(t0 * mu^epoch, t_max).
# schedule OFF: t stays 5.0. It advances per EPOCH, but arms differ in
# steps/epoch (107 vs 356 cases), so a growing t would tie constraint
# tightness to dataset size and break A0-vs-A1 comparability.
barrier_t_mu: 1.0
barrier_t_max: 100.0

volume_tolerance: 0.10
centroid_tolerance: 0.05
avgdist_tolerance: 0.05
avgdist_axis_tolerance: 0.05

lambda_moment2: 0.0      # 6 covariance components
lambda_moment3: 0.0       # 10 skewness components, target weight once fully warmed up
moment3_warmup_start: 100     # starts warming up at epoch 100
moment3_warmup_end: 200       # fully at 0.05 by epoch 200
#lambda_moment_inv: 0.0       # 3 rotation-invariant scalars (J1/J2/J3)

moment2_sqrt_diagonal: true   # sqrt of diagonal → sigma_z/y/x, stronger grad for thin structures
moment2_tolerance: 0.05
moment3_tolerance: 0.01  # updated according to values
moment_inv_tolerance: 0.01

lambda_moment_inv_J1: 0.0       # disable J1
lambda_moment_inv_J2: 0.0
lambda_moment_inv_J3: 0.0
moment_inv_J1_tolerance: 0.01
moment_inv_J2_tolerance: 5.0e-4
moment_inv_J3_tolerance: 1.0e-5

use_wandb: true
wandb_project: meunet-shape-supervision
wandb_run_name: A0_static_fixedcenter_full356
workdir: /home/isimion/meunet-shape-supervision-oai/oai_baselines/meunet_raw/results/A0_static_fixedcenter_full356